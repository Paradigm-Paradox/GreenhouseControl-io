substitutions:
  name: "greenhouse-ble-proxy"
  friendly_name: "Greenhouse Bluetooth BLE Gateway"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: "!secret wifi_ssid"
  password: "!secret wifi_password"

# Active Bluetooth Proxy for Home Assistant
# Relays BLE plant sensors (Xiaomi MiFlora, Inkbird, ThermoPro) wirelessly
# into Home Assistant with zero plant-side wiring!
esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: true

bluetooth_proxy:
  active: true

status_led:
  pin: GPIO2
